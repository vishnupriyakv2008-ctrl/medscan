/* MedScan AI visual system — adapted from MedScan_AI_Clinical_Light.pptx */
:root{color-scheme:light}
body{background:#f6f9fc;color:var(--navy);font-family:Calibri,'Segoe UI',sans-serif}
h1,h2,h3,.pagehead h1,.sectionhead h2,.modal h2,.dropzone h3,.statnum{font-family:Cambria,Georgia,serif;letter-spacing:0}
.sidebar{background:#fff;border-right-color:var(--mist)}

.brandmark{background:var(--teal);border-radius:10px}

.nav button:hover{background:#edf7f8;color:var(--teal)}
.nav button.active{background:#e1f5f4;color:#087e7a}
.privacy{background:#f5f9fc;border-color:var(--mist)}
.topbar{background:#ffffffed;border-bottom-color:var(--mist)}
.search,.select,.field input,.field select,.field textarea{border-color:var(--mist);color:var(--navy)}
.search{background:#f8fbfd}
.avatar{background:#dff3f1;color:#087e7a}
.eyebrow,.linkbtn{color:var(--teal)}
.btn{border-color:var(--mist);border-radius:9px;color:var(--navy)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.soft{background:#e6f7f6;border-color:#c8ece9;color:#087e7a}
.card{border-color:var(--mist);border-radius:14px;box-shadow:0 6px 22px #0B254508}
.staticon{background:#e5f7f6}
.pill.normal{background:#dff5f2;color:#087e7a}
.pill.high,.pill.low{background:#fff2d9;color:#946015}
.pill.critical{background:#ffeded;color:#c72f38}
.pill.info{background:#edf4ff;color:#2e67b4}
.pill.neutral{background:#eef3f8;color:#607b98}
.notice.good{background:#eaf8f7;border-color:#cbece9;color:#087e7a}
.notice.info{background:#edf4ff;border-color:#d5e4fa;color:#315e9c}
.tablewrap{border-color:var(--mist)}
th{background:#f2f7fb;color:#6B86A3}
td{border-top-color:#eaf0f6}
.field label{color:#4e6682}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #0E9F9A18}
.dropzone{border-color:#9dd8d4;background:#f4fbfb}
.dropzone.drag{background:#e1f5f4;border-color:var(--teal)}
.fileicon{background:#fff0f0;color:var(--red)}
.bar span{background:var(--teal)}
.progressring{background:conic-gradient(var(--teal) 0 74%,#e4edf4 74% 100%)}
.findingicon{background:#fff4df}
.tag{background:#eef4f8;color:#607b98}
.chartline{stroke:var(--teal)}
.chartpoint{fill:var(--teal)}
.dot{background:var(--teal)}
.toast{background:var(--navy)}
.modalback{background:#0B254566}
.footer{color:#6B86A3}
@media(max-width:720px){.sidebar{box-shadow:10px 0 30px #0B25451a}}
@media print{body{color:#0B2545}}

 if(a==="addresult"){let r=state.reports.find(r=>r.id===reviewId);if(!r)return;let x=analytes[0];r.results.push({id:"manual"+Date.now(),analyte:x.id,value:0,unit:x.unit,min:x.min,max:x.max,date:r.date,source:"Manual"});save();return render()}
 if(a.startsWith("delresult:")){let r=state.reports.find(r=>r.id===reviewId);if(r){r.results=r.results.filter(x=>x.id!==a.split(":")[1]);save();render()}return}
 if(a==="savereview"){let r=state.reports.find(r=>r.id===reviewId);if(!r)return;r.name=$("#revname").value.trim()||"Untitled report";r.date=$("#revdate").value||new Date().toISOString().slice(0,10);r.lab=$("#revlab").value;r.status=$("#revstatus").value;r.results.forEach(x=>x.date=r.date);save();toast("Report review saved locally");return go(4)}
 if(a==="savepatient"){state.patient={...state.patient,name:$("#pname").value||"Demo patient",id:$("#pid").value,age:+$("#page").value,sex:$("#psex").value,notes:$("#pnotes").value};save();toast("Patient profile saved");return render()}
 if(a==="savesettings"){state.settings.criticalDemo=$("#criticalToggle").checked;state.settings.defaultRange=$("#fallbackToggle").checked;state.patient.name=$("#displayName").value||state.patient.name;save();toast("Settings saved");return render()}
 if(a==="exportcsv")return exportCSV();
 if(a==="exportjson")return download("claritymed-demo-data.json",JSON.stringify(state,null,2),"application/json");
 if(a==="print")return window.print();
 if(a==="copysummary"){let text=`MedScan AI demo summary — ${state.patient.name}\nReports: ${state.reports.length}\nLatest findings:\n`+latestResults().filter(x=>["High","Low","Critically High","Critically Low"].includes(status(x))).map(x=>`${ainfo(x.analyte).name}: ${x.value} ${x.unit} (${status(x)}; range ${x.min}-${x.max})`).join("\n")+"\nNot a diagnosis; verify original lab reports and consult a clinician.";if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>toast("Summary copied")).catch(()=>modal("Copy summary",`<textarea rows="9" style="width:100%">${esc(text)}</textarea>`));else modal("Copy summary",`<textarea rows="9" style="width:100%">${esc(text)}</textarea>`);return}
 if(a==="markread"){state.notifications.forEach(n=>n.read=true);save();return render()}
 if(a.startsWith("readnotif:")){state.notifications[+a.split(":")[1]].read=true;save();return render()}
 if(a.startsWith("setlang:")){$("#language").value=a.split(":")[1];renderNav();render();toast("Language preference changed");return}
 if(a==="resetdemo")return confirmModal("Reset demo data","This replaces all local changes with the original fictional demo workspace.",()=>{state=structuredClone(seed);save();selectedReport=state.reports[0].id;reviewId=null;toast("Demo data reset");renderNav();render()});
 if(a==="wipe")return confirmModal("Delete all local data?","This permanently clears the MedScan AI demo data stored in this browser.",()=>{localStorage.removeItem("claritymed_demo_v1");state={patient:{name:"New patient",age:0,sex:"Not specified",id:"",notes:""},reports:[],settings:{notifications:false,defaultRange:false,criticalDemo:true},notifications:[]};selectedReport=null;reviewId=null;save();toast("Local demo data deleted");renderNav();go(0)});
}
function exportCSV(){let rows=[["Report","Date","Test","Value","Unit","Reference min","Reference max","Status","Range source"]];allResults().forEach(x=>rows.push([x.reportName,x.reportDate,ainfo(x.analyte).name,x.value,x.unit,x.min,x.max,status(x),x.source||"Manual"]));download("claritymed-results.csv",rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\r\n"),"text/csv;charset=utf-8")}
function download(name,content,type){let b=new Blob([content],{type}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);toast("Export prepared")}
function modal(title,body,buttons=""){ $("#modalroot").innerHTML=`<div class="modalback" id="modalback"><div class="modal"><h2>${title}</h2>${body}<div class="actions" style="justify-content:flex-end;margin-top:18px">${buttons||'<button class="btn" data-action="closemodal">Close</button>'}</div></div></div>`;$("#modalback").onclick=e=>{if(e.target.id==="modalback")$("#modalroot").innerHTML=""};$$("[data-action]").filter(x=>x.closest("#modalroot")).forEach(b=>b.onclick=()=>act(b.dataset.action))}
function confirmModal(title,desc,cb){modal(title,`<p>${desc}</p>`,`<button class="btn" data-action="closemodal">Cancel</button><button class="btn danger" id="confirmyes">Confirm</button>`);$("#confirmyes").onclick=()=>{$("#modalroot").innerHTML="";cb()};$("#modalroot").querySelector('[data-action="closemodal"]').onclick=()=>$("#modalroot").innerHTML=""}
document.addEventListener("click",e=>{let b=e.target.closest('[data-action="closemodal"]');if(b)$("#modalroot").innerHTML=""});
$("#menubtn").onclick=()=>$("#sidebar").classList.toggle("open");
$("#language").onchange=()=>{renderNav();render()};
$("#globalSearch").onkeydown=e=>{if(e.key==="Enter"){filterSearch=e.target.value;go(5);setTimeout(()=>{$("#resultSearch").value=filterSearch;filterResults()},20)}};
$("#notifBtn").onclick=()=>go(14);
function renderNavSafe(){renderNav()}
renderNav();render();
</script>
<style>
@media print{.sidebar,.topbar,.pagehead .actions,.btn,.linkbtn,.filters{display:none!important}.app{display:block}.content{max-width:none;padding:0}.card{box-shadow:none;break-inside:avoid;border:1px solid #ddd}.notice{border:1px solid #ddd}body{background:white}.footer{display:none}}
</style>
</body></html>
